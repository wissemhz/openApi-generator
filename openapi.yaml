openapi: 3.0.0
info:
  title: UPPJ redirectAPI
  version: 1.0.0
paths:
  /initUppj:
    post:
      summary:
        "Cette API permet de r\xE9cup\xE9rer une URL de d\xE9branchement vers\
        \ UPPJ"
      tags:
        - API init
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/initUppjReqDto"
            example:
              callerId: SSEC
              opportunityId: P20250725006335
              routeBackURL: http://souscription-ecommerce-qual.bnpparisbas-pf.com
              uploadMode: TUNN
              isKnownClient: false
              isSwitchMobile: false
              theme: THEME1
              commercialStructureDto:
                companyCode: "100"
                branch: "129"
                distributorNumber: "1007346166"
                territory: FRA
              applicantsContextDto:
                - role: TIT
              proofsContextDto:
                - proofCode: "58310"
                  proofControlType: STANDARD
              callerOnboardingType: FULL_ONLINE
              businessLine: ECOM
              onboardingType: VATC
              canal: ONLINE
              stepsDto:
                - id: identification
                  label: Identification
                  status: done
                - id: simulation
                  label: Simulation
                  status: done
                - id: documents
                  label: Documents
                  status: active
                - id: signature
                  label: Signature
                  status: pending
                - id: confirmation
                  label: Confirmation
                  status: pending
              recapOfferDto:
                durationInMonths: 5
                firstUseAmount: 1977
                taeg: 4%
                interestAmount: 0
                numberOfInstallments: 5
                totalAmountDue: 1977
                installmentWithInsurance: 395.4
                totalWithInsurance: 2084.13
                defermentInDays: 30
                monthlyDebitDay: 7
      responses:
        "200":
          description: "Succ\xE8s"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/initUppjRespDto"
        "400":
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "403":
          description: "Acc\xE8s refus\xE9"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
        "500":
          description: Erreur interne du serveur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDto"
components:
  schemas:
    initUppjReqDto:
      type: object
      properties:
        callerId:
          type: string
        opportunityId:
          type: string
        routeBackURL:
          type: string
        uploadMode:
          type: string
        isKnownClient:
          type: boolean
        isSwitchMobile:
          type: boolean
        theme:
          type: string
        commercialStructureDto:
          $ref: "#/components/schemas/CommercialStructureDto"
        applicantsContextDto:
          type: array
          items:
            $ref: "#/components/schemas/ApplicantDto"
        proofsContextDto:
          type: array
          items:
            $ref: "#/components/schemas/ProofDto"
        callerOnboardingType:
          type: string
        businessLine:
          type: string
        onboardingType:
          type: string
        canal:
          type: string
        stepsDto:
          type: array
          items:
            $ref: "#/components/schemas/StepDto"
        recapOfferDto:
          $ref: "#/components/schemas/RecapOfferDto"
    CommercialStructureDto:
      type: object
      properties:
        companyCode:
          type: string
        branch:
          type: string
        distributorNumber:
          type: string
        territory:
          type: string
    ApplicantDto:
      type: object
      properties:
        role:
          type: string
    ProofDto:
      type: object
      properties:
        proofCode:
          type: string
        proofControlType:
          type: string
    StepDto:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
    RecapOfferDto:
      type: object
      properties:
        durationInMonths:
          type: integer
        firstUseAmount:
          type: number
        taeg:
          type: string
        interestAmount:
          type: number
        numberOfInstallments:
          type: integer
        totalAmountDue:
          type: number
        installmentWithInsurance:
          type: number
        totalWithInsurance:
          type: number
        defermentInDays:
          type: integer
        monthlyDebitDay:
          type: integer
    initUppjRespDto:
      type: object
      properties:
        UppjUrl:
          type: string
    ErrorDto:
      type: object
      properties:
        error:
          type: string
          example: INVALID_REQUEST
        error_description:
          type: string
          example: Le format du champ 'callerId' est invalide
        additional_information:
          type: object
          example:
            field: callerId
            reason: missing or malformed
      required:
        - error
        - error_description
